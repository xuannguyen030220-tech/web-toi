<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dịch Vụ</title>
</head>
<style>
body {
    background-color: #2a3148;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 30px;
    align-items: center;
  }
  
  .img1 {
    width: 90%;
    height: 90%;
    border-radius: 16px;
  }
  
  p {
    background-image: url('anh/t1.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    color: white;
    border: 4px solid #3e4e7d;
    font-size: 60px;
    font-weight: bold;
    font-family: 'Monterrac', sans-serif;
    width: 100%;
    border-radius: 16px;
    margin-top: 10px;
    text-align: center;
    padding: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  }

   .cach {
    background-color: #243467;
    width: 110%;
    height: 7px;
    border-radius: 10px;
  }

  .doc {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    height: 100%;
    margin-top: 1px;
  }

   .ngang {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 60%;
    height: 620px;
  }

</style>
<body>
    <p>DỊCH VỤ</p>
    <div class="cach"></div>
    <div class="doc">
        <img src="anh/g1.jpg" class="img1" alt="Dịch vụ 1">
        <img src="anh/g2.jpg" class="img1" alt="Dịch vụ 2">
        <img src="anh/g3.jpg" class="img1" alt="Dịch vụ 3">
        <img src="anh/g4.jpg" class="img1" alt="Dịch vụ 4">
        <img src="anh/g5.jpg" class="img1" alt="Dịch vụ 5">
    </div>
</body>
</html>
