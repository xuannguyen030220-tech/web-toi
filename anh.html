<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anhthem</title>
</head>
<style>
  body {
    background-color: #2a3148;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 30px;
    align-items: center;
  }
  
  img {
    max-width: 100%;
    border-radius: 16px;
  }
  
  p {
    background-image: url('anh/t1.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    color: white;
    border: 4px solid #3e4e7d;
    font-size: 60px;
    font-weight: bold;
    font-family: 'Monterrac', sans-serif;
    width: 100%;
    border-radius: 16px;
    margin-top: 10px;
    text-align: center;
    padding: 10px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  }

   .cach {
    background-color: #243467;
    width: 110%;
    height: 7px;
    border-radius: 10px;
  }

  .ngang {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 60%;
    height: 620px;
  }

   .dong {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: row; 
    height: 620px;
    width: 60%;
    gap: 20px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 20px;
  }
</style>
<body>
    <p>HÌNH ẢNH</p>

    <div class="cach"></div>

    <div class="ngang">
      <img src="anh/tp9.jpg" class="dong" alt="Hình ảnh">
      <img src="anh/tp6.jpg" class="dong" alt="Hình ảnh">
      <img src="anh/e4.jpg" class="dong" alt="Hình ảnh">
    </div>
     <div class="ngang">
      <img src="anh/re1.jpg" class="dong" alt="Hình ảnh">
      <img src="anh/re2.jpg" class="dong" alt="Hình ảnh">
      <img src="anh/re3.jpg" class="dong" alt="Hình ảnh">
    </div>
     <div class="ngang">
      <img src="anh/k1.jpg" class="dong" alt="Hình ảnh">
      <img src="anh/k2.jpg" class="dong" alt="Hình ảnh">
      <img src="anh/k3.jpg" class="dong" alt="Hình ảnh">
    </div>
</body>
</html>
