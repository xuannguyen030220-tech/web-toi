<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Nguyen - Grid Version</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: rgb(180, 160, 178);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            overflow-x: hidden;
            padding: 10px;
        }

        /* --- Định dạng chung cho ảnh --- */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        /* --- Khối tiêu đề --- */
        .section-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Monterrac', sans-serif;
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            margin-bottom: 10px;
            text-align: center;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* --- KHU VỰC LƯỚI NGANG (Cả điện thoại lẫn máy tính đều nằm ngang) --- */
        .content-row {
            display: flex;
            flex-direction: row; /* Luôn luôn nằm ngang */
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px; /* Khoảng cách nhỏ giữa các ảnh để vừa màn hình điện thoại */
            margin-top: 8px;
        }

        /* --- Định dạng cho các phần tử bên trong hàng --- */
        .grid-item {
            flex: 1; /* Các ảnh tự động chia đều không gian ngang */
            max-width: 32%; /* Mỗi ảnh chiếm khoảng gần 1/3 hàng để vừa 3 tấm */
            object-fit: cover;
        }

        /* --- Khung văn bản lý lịch --- */
        .info-box {
            color: #333;
            font-size: 11px; /* Chữ nhỏ lại cho vừa khung trên điện thoại */
            font-weight: bold;
            text-align: center;
            flex: 1.2;
            background-color: #f7f9fa;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            line-height: 1.4;
        }

        /* Tùy chỉnh riêng cho ảnh bìa lớn ở trên */
        .banner-img {
            width: 100%;
            border: 4px solid #e05ccc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

    </style>
</head>
<body>

    <!-- Ảnh pha lê ở trên -->
    <img src="nền/phale.png" class="banner-img">
    
    <!-- Tiêu đề LÝ LỊCH -->
    <p class="section-title" style="background-color: #cd7cc2; border: 4px solid #ee8fe1;">
        ___-->LÝ LỊCH<--___
    </p>

    <!-- Hàng Lý lịch (Nằm ngang 3-4 cột) -->
    <div class="content-row">
        <img src="anh/anh2,1.png" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
        
        <div class="info-box">
            ══════ஜ۩۞۩ஜ══════<br> 
            Tên: <br>---<br>
            STĐ: <br>---<br>
            Ngày sinh: <br>---<br>
            Quê quán: <br>---<br>
        </div>

        <img src="anh/anh3.png" class="grid-item" style="border-radius: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
        
        <img src="anh/anh4.jpg" class="grid-item" style="border-radius: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); border: 2px dashed #cd7cc2;">
    </div>

    <!-- Tiêu đề TÁC PHẨM -->
    <p class="section-title" style="background-color: #c089e0; border: 4px solid #ee8fe1;">
        ___-->TÁC PHẨM<--___
    </p>

    <!-- Hàng 1 Tác phẩm (Nằm ngang 3 ảnh) -->
    <div class="content-row">
       <img src="anh/tp1.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
       <img src="anh/tp2.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
    </div>

    <!-- Hàng 2 Tác phẩm -->
    <div class="content-row">
       <img src="anh/tp5.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
       <img src="logo/logo.jpg" class="grid-item" style="border-radius: 30px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); border: 2px dashed #cd7cc2;">
       <img src="anh/tp7.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
    </div>

    <!-- Hàng 3 Tác phẩm -->
    <div class="content-row">
        <img src="anh/tp8.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
        <img src="anh/tp9.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
        <img src="anh/tp10.jpg" class="grid-item" style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);">
    </div>

</body>
</html>
