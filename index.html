<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Nguyen</title>
    <style>
        body {
            background-color: rgb(180, 160, 178);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            margin: 0;
            flex-direction: column;
            overflow-x: hidden;
            margin-top: 30px;
            width: 100%;
        }
        .ly-lich {
            background-color: #f7f9fa;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        
        img {
            max-width: 90%;
            border-radius: 16px;
        }

        /* Khung chứa nằm ngang trên máy tính */
        .vung-chua-ngang {
            display: flex;
            flex-direction: row; 
            align-items: center; 
            justify-content: center;
            width: 90%;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .tac-pham {
            display: flex;
            flex-direction: row; 
            align-items: center; 
            justify-content: center;
            width: 90%;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* --- PHẦN TỰ ĐỘNG ĐIỀU CHỈNH CHO ĐIỆN THOẠI (RESPONSIVE) --- */
        @media (max-width: 768px) {
            .vung-chua-ngang, .tac-pham {
                flex-direction: column !important; /* Chuyển thành xếp dọc trên điện thoại */
            }
            .vung-chua-ngang img, .tac-pham img {
                width: 90% !important;
                height: auto !important;
                margin-left: 0 !important;
                margin-top: 15px !important;
            }
            body {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
